<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | Olympic Gym</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/logo.svg" />
  <style>
    :root { --bg: #F3F6FA; --text: #14171C; --muted: #5B6472; --blue: #0081C8; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1217; --text: #F3F6FA; --muted: #9AA4B2; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px;
      background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    img { width: 110px; margin: 0 auto 18px; display: block; }
    h1 { margin: 0 0 8px; font-size: 2rem; text-transform: uppercase; letter-spacing: .03em; }
    p { color: var(--muted); margin: 0 0 22px; }
    a { display: inline-block; padding: 12px 22px; border-radius: 999px; background: var(--blue); color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.svg" alt="Olympic Gym" />
    <h1>Page not found</h1>
    <p>This page doesn't exist. Head back to the Olympic Gym home page.</p>
    <a href="/">Go to home page</a>
  </main>
</body>
</html>
